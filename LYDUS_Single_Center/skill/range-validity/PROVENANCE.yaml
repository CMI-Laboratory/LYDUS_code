changelog:
  - version: "1.0"
    date: 2026-06-10
    summary: >
      Initial skill creation. DuckDB SQL (scripts/duckdb.sql) added using PERCENTILE_CONT
      for IQR computation. Python version (scripts/range_validity.py) retained for
      boxplot visualization and outlier CSV export. Fixed chained indexing and bare except.
      Row-dict pattern replaces summary_df.loc[len()] assignment. weight parameter
      externalized (original hardcoded 1.5).
