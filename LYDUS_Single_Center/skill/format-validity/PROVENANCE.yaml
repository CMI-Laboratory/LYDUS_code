changelog:
  - version: "1.0"
    date: 2026-06-10
    summary: >
      Initial skill creation. DuckDB SQL version (scripts/duckdb.sql) implements rule-based
      code type detection via CASE WHEN + regexp_matches(). Python version (scripts/format_validity.py)
      retains LLM fallback with api_key=None option.
      Fixed: original aggregation used 'Invalid_code' to store valid count — renamed to Valid_code
      for clarity, then computed Invalid_code = Total - Valid.
