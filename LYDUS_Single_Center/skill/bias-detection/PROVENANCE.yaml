changelog:
  - version: "1.0"
    date: 2026-06-10
    summary: >
      Initial skill creation. Python-only orchestrator (no SQL).
      Bug fix: model_ver undefined variable in llm_ask_column calls → config['model_ver'].
      Bug fix: get_time_series_consistency argument order reversed → (quiq, save_path).
      Bug fix: get_code_validity returned 2 values but was unpacked as 3.
      Adapted get_unstructured_fidelity → get_note_fidelity (8 return values).
      Adapted get_unstructured_accuracy → get_note_accuracy.
      Replaced hardcoded save_path=-1 with actual config save_path.
      Dynamic sys.path injection for sibling skill imports.
      Refactored 3x duplicate group-iteration loops into _run_groups helper.
      Used os.path.join throughout. Added required=True to --config argparse.
