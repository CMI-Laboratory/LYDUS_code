changelog:
  - version: "1.0"
    date: 2026-06-10
    summary: >
      Initial skill creation. Python-only (no SQL — sklearn + SHAP required).
      Bug fix: Prescription filter changed from Mapping_info_1.str.contains('drug')
      (always empty) to Mapping_info_2.str.contains('drug') (correct).
      Refactored 4 duplicate category blocks into _run_category, _build_pivot_and_years,
      _detect_change_points helpers. Fixed SettingWithCopyWarning on all filtered slices.
      Used os.path.join throughout. Added required=True to --config argparse.
