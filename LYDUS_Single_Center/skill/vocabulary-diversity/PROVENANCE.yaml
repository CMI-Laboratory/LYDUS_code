changelog:
  - version: "1.0"
    date: 2026-06-10
    summary: >
      Initial skill creation. Python-only (no SQL — NLTK tokenization required).
      Fixed SettingWithCopyWarning: df_note['TEXT_words'] assignment without .copy() → added .copy().
      Replaced assert with graceful FAIL + empty return.
      Clarified total_words variable reuse confusion → total_count / counter separated.
      Added matplotlib.use('Agg') for headless environments.
      Used os.path.join throughout. Added required=True to --config argparse.
