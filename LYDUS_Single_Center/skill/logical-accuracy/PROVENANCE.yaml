changelog:
  - version: "1.0"
    date: 2026-06-10
    summary: >
      Initial skill creation. Python-only (no SQL — LLM + ML models required).
      Fixed missing comma bug: 'Outlier Num' 'Logical Accuracy (%)' → separate columns.
      Cleaned up original 698-line file: extracted helper functions (llm_ask_sex,
      llm_ask_birthdate, llm_ask_recommend, _train_autoencoder), standardized Autoencoder
      as nn.Module, added YAML config support via argparse.
