changelog:
  - version: "1.0"
    date: 2026-05-27
    summary: >
      Initial skill creation. BigQuery SQL (scripts/bigquery.sql) converted from
      DuckDB v5 (02_mimic_to_quiq_v5_260527.sql). Key changes: CREATE TEMP FUNCTION
      for _var_type/_is_cat macros, BigQuery UNPIVOT syntax, mimiciv_* table names,
      STRING type, SAFE.PARSE_TIMESTAMP/SAFE_CAST. Mapping_info_1/2 fully explicit
      per guideline §1.5.2 (Rules 3-8).
  - version: "1.1"
    date: 2026-06-10
    summary: >
      Added MIMIC_IV_NOTE schema support: discharge, discharge_detail, radiology,
      radiology_detail 4개 테이블 추가. discharge/radiology는 base+all CTE 패턴으로
      원본 1행 → 4 QUIQ 행 (text/storetime/note_type/note_seq). text 행은
      Mapping_info_1='note_clinical'(discharge) 또는 'note_rad'(radiology). Variable_ID에
      note_id 저장. discharge_detail/radiology_detail은 parent 테이블과 note_id JOIN으로
      hadm_id 확보. note_type 실제 값 확인: discharge='DS', radiology='RR'/'AR'.